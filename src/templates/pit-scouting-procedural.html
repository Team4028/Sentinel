<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- load the favicon.ico beakhead favicon (the thing on the left of the tab) -->
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{url_for('static', filename='css/form.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/button.css')}}">
    <title>Pit Scouting</title>
    <style>
        :root {
            --accent: {{accent}};
            --text: {{text}};
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
        }

        @media screen and (min-width: 1024px) {
            body {
                padding: 2rem;
            }
        }

        #status {
            font-size: large;
            position: fixed;
            bottom: 1rem;
            right: 2rem;
            z-index: 10;
        }

        video,
        #preview {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 1rem;
        }

        button, select, input[type="file"] {
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <script src="{{url_for('static', filename='js/navigate.js')}}"></script>
    <div class="panel">
        <h1> <img src="{{ url_for('static', filename='favicon.ico') }}"
                style="height: 5rem; transform: translateY(2rem);"> Pit Scouting</h1>
        <label title="Team Number">
            Team Number
            <input type="number" id="tn" step="1">
        </label>
        {% for field in pit_scouting_data %}
        <label title="{{field.name}}">
            <h2>{{ field.name }}</h2>
            <h4>{{field.description}}</h4>
            {% if field.type == 'select' %}
            <select id="{{field.id}}">
                {% for opt in field.options %}
                <option value="{{opt.value}}">{{ opt.display_name }}</option>
                {% endfor %}
            </select>
            {% elif field.type == 'text' %}
            <textarea id="{{field.id}}" placeholder="Type here..."></textarea>
            {% else %}
            <input type="{{field.type}}" id="{{field.id}}" {% if field.type == 'number' and 'step' in field %} step="{{field.step}}" {% endif %} {% if field.type == 'number' and 'max' in field %} max="{{field.max}}" {% endif %} {% if field.type == 'number' and 'min' in field %} min="{{field.min}}" {% endif %}>
            {% endif %}
        </label>
        {% endfor %}

        <div>
            <label for="fileInput">Upload an image:</label>
            <input type="file" id="fileInput" accept="image/*">
            <br><br>
            <label>OR</label>
            <br><br>
            <label for="cameraSelect">Select Camera:</label>
            <select id="cameraSelect"></select>
            <button class="sbutton" id="startCamera">Take a Picture with Camera</button>
            <video id="camera" autoplay></video>
            <button class="sbutton" id="capture" style="display: none;">Take Picture</button>

            <img id="preview" alt="Image preview...">
        </div> 
        <button class="sbutton" id="sub" disabled>Submit</button>
        <button class="sbutton" onclick="window.location.reload()">Reset</button>
    </div>
    <div id="status"></div>
    <div class="back-cont" style="position: fixed;">
        <button class="sbutton" onclick="window.goBack();" title="Ctrl+Backspace">Back</button>
    </div>
    <script>
        const cameraSelect = document.getElementById("cameraSelect");
        const sub = document.getElementById("sub");
        const tn = document.getElementById("tn");
        
        const fileInput = document.getElementById("fileInput");
        const preview = document.getElementById("preview");
        const startCamera = document.getElementById("startCamera");
        const camera = document.getElementById("camera");
        const capture = document.getElementById("capture");
        const statusDiv = document.getElementById("status");
        let imageBlob;
        let stream;

        const numberFields = Array.from(document.querySelectorAll("input[type='number']"));

        tn.addEventListener("input", () => sub.disabled = (tn.value === "" || Number.isNaN(parseInt(tn.value)) || parseInt(tn.value) <= 0));

        async function listCameras() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(device => device.kind === 'videoinput');
            cameraSelect.innerHTML = '';
            videoDevices.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `Camera ${index + 1}`;
                cameraSelect.appendChild(option);
            });
        }

        sub.addEventListener('click', savePitScouting);

        async function savePitScouting() {
            if (imageBlob) {
                statusDiv.style.color = "#aaa";
                statusDiv.innerText = "Saving photo...";
                const fData = new FormData();
                fData.append('photo', imageBlob, 'photo.png');
                const response = await fetch('{{url_for("upload_photo")}}', {
                    method: 'POST',
                    headers: {
                        "team": String(tn.value),
                    },
                    body: fData
                });
            }

            statusDiv.style.color = "#aaa";
            statusDiv.innerText = "Saving data...";
            const json = {
                "tn": parseInt(tn.value),
                {% for field in pit_scouting_data %}
                {% if field.type == 'number' %}
                "{{field.id}}": parseFloat(document.getElementById("{{field.id}}").value).toFixed(2),
                {% elif field.type == 'bool' %}
                "{{field.id}}": document.getElementById("{{field.id}}").checked,
                {% else %}
                "{{field.id}}": document.getElementById("{{field.id}}").value,
                {% endif %}
                {% endfor %}
            };

            const res = await fetch('{{url_for("save_pit")}}', {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify(json)
            });

            if (res.ok) {
                statusDiv.style.color = "#0a0";
                statusDiv.innerHTML = "";
                statusDiv.innerText = "Save Successful.";
                setTimeout(() => statusDiv.innerHTML = "", 2000);
            } else {
                statusDiv.style.color = "#a00";
                statusDiv.innerHTML = `Save Error: ${await res.text()}`;
            }
        }

        window.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === "Backspace" && !["input", "textarea"].includes(document.activeElement.tagName.toLowerCase())) {
                e.preventDefault();
                window.goBack();
            }
        });


        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                imageBlob = file;
                preview.src = URL.createObjectURL(file);
            }
        });

        startCamera.addEventListener('click', async () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            preview.src = "";
            const selectedDeviceId = cameraSelect.value;
            stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: selectedDeviceId } } });
            camera.srcObject = stream;
            camera.style.display = 'block';
            capture.style.display = 'inline';
        });

        capture.addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            canvas.width = camera.videoWidth;
            canvas.height = camera.videoHeight;
            canvas.getContext('2d').drawImage(camera, 0, 0);
            canvas.toBlob((b) => {
                imageBlob = b;
                preview.src = URL.createObjectURL(b);
            }, "image/png");

            stream.getTracks().forEach(track => track.stop());
            camera.style.display = 'none';
            camera.style.display = 'none';
        });
        listCameras();
    </script>
    <script src="{{url_for('static', filename='js/register-sw.js')}}"
        onload="registerServiceWorker('/service_worker.js')"></script>
</body>

</html>
