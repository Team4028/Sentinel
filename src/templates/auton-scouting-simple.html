<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- load the favicon.ico beakhead favicon (the thing on the left of the tab) -->
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{url_for('static', filename='css/button.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/form.css')}}">
    <title>Auton Scouting</title>
    <style>
        :root {
            --accent: {{accent}};
            --text: {{text}};
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', serif;
        }

        body {
            margin: 0;
            padding: 2rem;
            background: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
        }

        #status {
            font-size: large;
            position: fixed;
            bottom: 1rem;
            right: 2rem;
            z-index: 10;
        }

        button, select, input[type="file"] {
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <script src="{{url_for('static', filename='js/navigate.js')}}"></script>
    <div class="panel">
        <h1> <img src="{{ url_for('static', filename='favicon.ico') }}"
                style="height: 5rem; transform: translateY(2rem);">Auton Scouting</h1>
        <label title="Team Number">
            Team Number
            <input type="number" id="tn" step="1">
        </label>
        <label title="Time">
            Time (ask how to calculate)
            <input type="number" id="time">
        </label>
        <button class="sbutton" id="sub" disabled title="Enter a team number">Submit</button>
        <button class="sbutton" onclick="window.location.reload()">Reset</button>
    </div>
    <div id="status"></div>
    <div class="back-cont">
        <button class="sbutton" onclick="window.goBack();" title="Ctrl+Backspace">Back</button>
    </div>
    <script>
        const tn = document.getElementById("tn");
        const autoMobility = document.getElementById("auto-mobility");
        const bumpTrench = document.getElementById("bump-trench");
        const vibeLemsRange = document.getElementById("vl-range");
        const statusDiv = document.getElementById("status");
        const sub = document.getElementById('sub');

        tn.addEventListener("input", () => {
            sub.disabled = (tn.value === "" || Number.isNaN(parseInt(tn.value)) || parseInt(tn.value) <= 0);
            if (sub.disabled) {
                sub.title = "Enter a team number"
            } else {
                sub.title = "";
            }
        });

        sub.addEventListener('click', savePitScouting);

        async function savePitScouting() {
            statusDiv.style.color = "#aaa";
            statusDiv.innerText = "Saving data...";
            const json = {
                "tn": parseInt(tn.value),
                "time": parseFloat(document.getElementById("time").value)
            };

            const res = await fetch('{{url_for("save_auto_simple")}}', {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify(json)
            });

            if (res.ok) {
                statusDiv.style.color = "#0a0";
                statusDiv.innerHTML = "";
                statusDiv.innerText = "Save Successful.";
                setTimeout(() => statusDiv.innerHTML = "", 2000);
            } else {
                statusDiv.style.color = "#a00";
                statusDiv.innerHTML = `Save Error: ${await res.text()}`;
            }
        }

        window.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === "Backspace" && document.activeElement.tagName.toLowerCase() !== "input") {
                e.preventDefault();
                window.goBack();
            }
        });
    </script>
    <script src="{{url_for('static', filename='js/register-sw.js')}}"
        onload="registerServiceWorker('/service_worker.js')"></script>
</body>

</html>
